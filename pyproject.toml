[project]
name = "monarch-tui"
version = "0.1.0"
description = "A blazing-fast terminal UI for Monarch Money transaction management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Wes McKinney"},
]
keywords = ["monarch-money", "tui", "terminal", "finance", "transactions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "aiohttp>=3.8.4",
    "gql>=3.4",
    "oathtool>=2.3.1",
    "polars>=0.19.0",
    "textual>=0.47.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "textual-dev>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[project.scripts]
monarch-tui = "monarch_tui.app:main"
monarch-setup = "monarch_tui.credentials:setup_credentials_interactive"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monarch_tui"]

[tool.uv]
dev-dependencies = [
    "textual-dev>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)
